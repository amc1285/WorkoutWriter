<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool Deck – swim workout writer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5F7; --bg-soft:#F7FAFB; --surface:#FFFFFF; --ink:#13273A; --muted:#5A6E7D;
  --line:#D6E0E6; --line-strong:#B4C4CF; --aqua:#0E8794; --aqua-ink:#0A6B76; --aqua-tint:#DCF0F2;
  --red:#C23B2B; --amber:#B07A00; --focus:#0E8794;
  --f-ui:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",Barlow,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D1923; --bg-soft:#12212D; --surface:#152736; --ink:#E7EFF4; --muted:#97ABB8;
    --line:#26404F; --line-strong:#3A5667; --aqua:#3DC0CE; --aqua-ink:#6FD5E0; --aqua-tint:#143841;
    --red:#EE6A58; --amber:#E7B53A; --focus:#3DC0CE;
  }
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-ui);-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.num{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums}
.sr{position:absolute;left:-9999px}

/* lane rope strip */
.rope{height:8px;background:repeating-linear-gradient(90deg,#1E5FA8 0 40px,#fff 40px 48px,#C23B2B 48px 88px,#fff 88px 96px)}
.top{display:flex;align-items:center;gap:22px;padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font:600 28px/1 var(--f-num);letter-spacing:.01em;color:var(--ink);text-decoration:none}
.top nav{display:flex;gap:2px}
.top nav a,.top nav button{background:none;border:0;padding:8px 12px;border-radius:4px;color:var(--muted);text-decoration:none;cursor:pointer}
.top nav a:hover,.top nav button:hover{color:var(--ink);background:var(--bg)}
.top nav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--aqua)}
.status{margin-left:auto;font-size:14px;color:var(--muted)}
.brand,.top nav a,.top nav button{white-space:nowrap}
@media (max-width:640px){.top{flex-wrap:wrap;gap:4px 12px;padding:8px 12px}.top nav{order:3;width:100%;overflow-x:auto}main{padding:14px 12px}}
.status.bad{color:var(--red)}

main{max-width:1320px;margin:0 auto;padding:20px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:7px 13px;cursor:pointer;text-decoration:none;color:var(--ink);line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--aqua);border-color:var(--aqua);color:#fff}
.btn.primary:hover{background:var(--aqua-ink);border-color:var(--aqua-ink)}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 9px;font-size:14px}
.btn.icon{padding:7px 11px}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select{background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:7px 10px;min-width:0}
input.bad{border-color:var(--red)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--muted)}
label.f input,label.f select{color:var(--ink);font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.side{position:sticky;top:14px;display:flex;flex-direction:column;gap:14px}
@media (max-width:960px){.two{grid-template-columns:1fr}.side{position:static}}

/* week */
.wk-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:16px}
.wk-head h1{font:600 34px/1 var(--f-num);margin-right:6px}
.wk-head .sp{flex:1}
.day{display:grid;grid-template-columns:92px minmax(0,1fr) 118px;gap:0;margin-bottom:10px}
.day .dh{padding:12px 14px;border-right:1px solid var(--line)}
.day .dh b{display:block;font:600 22px/1.1 var(--f-num)}
.day.today .dh{box-shadow:inset 4px 0 0 var(--aqua)}
.day .db{padding:6px 10px;min-width:0}
.day .dt{padding:12px 14px;text-align:right;border-left:1px solid var(--line);background:var(--bg-soft)}
.day .dt .num{font-size:28px;line-height:1}
.day .dt small{display:block;color:var(--muted);font-size:13px}
.prac{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;padding:9px 6px;border-radius:4px;cursor:pointer}
.prac:hover{background:var(--bg)}
.prac + .prac{border-top:1px solid var(--line)}
.prac .pt{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prac .pt span{color:var(--muted);font-weight:400;margin-right:8px}
.prac .py{font:600 20px/1 var(--f-num);text-align:right}
.prac .pc{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:5px}
.chip{--gc:var(--aqua);display:inline-flex;align-items:center;gap:6px;padding:1px 9px 1px 7px;border:1px solid var(--gc);border-radius:99px;font-size:13px;background:color-mix(in srgb,var(--gc) 12%,transparent);color:var(--ink)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gc)}
.addrow{padding:4px 6px 6px}
.restday{color:var(--muted);padding:9px 6px;font-size:15px}
@media (max-width:640px){.day{grid-template-columns:70px minmax(0,1fr)}.day .dt{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;text-align:left}}

/* side panels */
.sp-card{padding:16px}
.big{font:600 64px/0.95 var(--f-num);letter-spacing:-.01em}
.big small{font:500 20px var(--f-ui);color:var(--muted);letter-spacing:0;margin-left:6px}
.kv{display:flex;gap:22px;margin-top:10px;flex-wrap:wrap}
.kv div{display:flex;flex-direction:column}
.kv b{font:600 24px/1.1 var(--f-num)}
.kv span{font-size:13px;color:var(--muted)}
.sp-card h3{font-size:15px;color:var(--muted);font-weight:500;margin-bottom:8px}
.bd + .bd{margin-top:16px}
.bar-row{display:grid;grid-template-columns:76px minmax(0,1fr) 78px;gap:8px;align-items:center;font-size:14px;padding:2px 0}
.bar{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums}
.bar-row .v em{font-style:normal;color:var(--muted);font-size:12px;margin-left:4px}
.cols{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.col{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.col .cv{font-size:13px;height:16px;line-height:16px;color:var(--muted)}
.col .cb{height:84px;width:100%;display:flex;align-items:flex-end;background:var(--bg-soft);border-radius:2px}
.col .cb i{display:block;width:100%;background:var(--aqua);border-radius:2px 2px 0 0;min-height:0}
.col .cl{font-size:13px;color:var(--muted)}
.grp-table{width:100%;border-collapse:collapse;font-size:15px}
.grp-table td{padding:6px 0;border-top:1px solid var(--line)}
.grp-table tr:first-child td{border-top:0}
.grp-table td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.grp-table button{background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left}
.grp-table .on button{font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gc,var(--aqua));flex:none}

/* editor */
.ed-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.ed-top .title{flex:1;min-width:220px;font:600 26px/1.2 var(--f-ui);padding:6px 10px}
.meta{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;margin-bottom:16px}
.meta .pool{display:flex;gap:6px}
.meta .pool input{width:64px}
.meta input.ivl{width:84px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;min-height:38px}
.tab{--gc:var(--aqua);display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:99px;padding:5px 14px 5px 11px;cursor:pointer}
.tab::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--gc)}
.tab[aria-selected="true"]{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 14%,var(--surface));font-weight:600;box-shadow:inset 0 0 0 1px var(--gc)}
.tabhint{color:var(--muted);font-size:14px}
.pad{display:grid;grid-template-columns:minmax(0,1fr) var(--gw,224px);background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ew{position:relative;min-width:0}
.mirror,.ta{font:15px/24px var(--f-mono);padding:14px 16px 90px;margin:0;border:0;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:2;letter-spacing:0}
.mirror{min-height:460px;pointer-events:none;color:var(--ink)}
.ln{min-height:24px}
.ln.hdr{background:color-mix(in srgb,var(--gc) 16%,transparent);box-shadow:inset 3px 0 0 var(--gc);margin:0 -16px;padding:0 16px}
.ln.dim{opacity:.34}
.t-set{color:var(--ink)}
.t-int{color:var(--aqua-ink)}
.t-time{color:var(--amber)}
.t-note{color:var(--muted)}
.ta{position:absolute;inset:0;width:100%;height:100%;resize:none;overflow:hidden;background:transparent;color:transparent;caret-color:var(--ink);outline:none}
.ta::placeholder{color:var(--muted);opacity:.8}
.ta::selection{background:color-mix(in srgb,var(--aqua) 30%,transparent);color:transparent}
.gut{position:relative;border-left:1px solid var(--line);background:var(--bg-soft);font:12px/24px var(--f-mono);overflow:hidden}
.gy{position:absolute;left:0;width:50px;text-align:right;color:var(--muted)}
.gy.t{font-style:italic}
.gband{position:absolute;top:0;bottom:0;width:58px;background:color-mix(in srgb,var(--gc) 11%,transparent)}
.gc{position:absolute;width:58px;text-align:right;padding-right:5px;border-top:1px solid var(--line-strong);margin-top:-1px;line-height:23px;font-weight:500;color:var(--ink)}
.gk{position:absolute;width:66px;text-align:right;padding-right:6px;border-top:1px solid var(--line-strong);margin-top:-1px;line-height:23px;color:var(--muted)}
.padhead{display:grid;grid-template-columns:minmax(0,1fr) var(--gw,224px);margin-bottom:3px;font-size:12px}
.gh{display:flex;gap:4px;padding-left:54px;min-width:0}
.gh>*{width:58px;flex:none;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh button{--gc:var(--aqua);background:none;border:0;border-bottom:3px solid var(--gc);padding:2px 2px 3px;cursor:pointer;color:var(--muted);font-size:12px}
.gh button.act{color:var(--ink);font-weight:600;background:color-mix(in srgb,var(--gc) 13%,transparent)}
.gh .gl{color:var(--muted);padding:2px 0 3px;border-bottom:3px solid transparent}
.gh .gl.time{width:66px;text-align:right;padding-right:6px}
@media (max-width:760px){
  .padwrap{--gw:100px!important}
  .gy,.gk,.gc:not(.act),.gband:not(.act),.gh>*:not(.act){display:none}
  .gc.act{left:4px!important;width:92px}.gband.act{left:0!important;width:100%}
  .gh{padding-left:0}.gh button.act{width:96px}
  .mirror,.ta{font-size:14px}
}
details.help{margin-top:12px;padding:10px 14px}
.selcard{margin-top:12px;padding:12px 16px}
.sel-h{font-size:13px;color:var(--muted);margin-bottom:8px}
.sel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px 16px;font-size:14px}
.sel-grid>div>span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.sel-grid b{display:block;font:600 24px/1.05 var(--f-num)}
.sel-grid em{font-style:normal;color:var(--muted)}
details.help summary{cursor:pointer;color:var(--muted)}
details.help pre{margin:10px 0 0;font:13px/1.55 var(--f-mono);white-space:pre-wrap;color:var(--ink)}
.grp-note{font-size:13px;color:var(--muted);margin-top:8px}

/* search */
.sr-row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:14px;padding:12px 14px;align-items:center;border-top:1px solid var(--line)}
.sr-row:first-child{border-top:0}
.sr-row .snip{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-row mark{background:var(--aqua-tint);color:var(--ink);padding:0 2px;border-radius:2px}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}

dialog{border:1px solid var(--line-strong);border-radius:8px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100% - 28px))}
dialog::backdrop{background:rgba(8,18,26,.55)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font:600 26px/1.1 var(--f-num)}
.dlg .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.dlg .chips{display:flex;gap:6px;flex-wrap:wrap}
.dlg .chips button{cursor:pointer}
.dlg .foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.dlg hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90%}
#toast.on{opacity:1}

/* print */
#printRoot{display:none}
@media print{
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block}
  body{background:#fff;color:#000}
  .pp{page-break-after:always;break-after:page;font:12.5pt/1.4 Barlow,Arial,sans-serif;color:#000;padding:0}
  .pp:last-child{page-break-after:auto;break-after:auto}
  .pp .h{text-align:center;border-bottom:1px solid #999;padding-bottom:8px;margin-bottom:14px}
  .pp .h b{display:block;font-size:14pt;font-weight:600}
  .pp .h span{display:block;font-size:11pt}
  .pp .h small{display:block;font-size:10pt;color:#333}
  .pp .tag{font-weight:600;margin-bottom:8px}
  .pp .l{white-space:pre-wrap;overflow-wrap:break-word;min-height:1.2em}
  .pp .gap{height:.9em}
  .pp .rt{text-align:right;font-size:9.5pt;color:#555;margin:2px 0 8px}
  .pp .tot{margin-top:22px;text-align:right;font-weight:600;border-top:1px solid #999;padding-top:6px}
}
</style>
</head>
<body>
<div class="rope" aria-hidden="true"></div>
<header class="top">
  <a class="brand" href="#/week">Pool Deck</a>
  <nav aria-label="Main">
    <a href="#/week" id="nav-week">Week</a>
    <a href="#/search" id="nav-search">Search</a>
    <button type="button" id="btn-settings">Settings &amp; backup</button>
  </nav>
  <span id="status" class="status" role="status"></span>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<div id="printRoot"></div>
<noscript><p style="padding:20px">Pool Deck needs JavaScript turned on.</p></noscript>

<script>
'use strict';
/*CORE-START*/
/* ---------- small helpers ---------- */
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pdate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = pdate(s); d.setDate(d.getDate()+n); return dstr(d); };
const todayStr = () => dstr(new Date());
const fmtShort = s => { const d = pdate(s); return `${DOW[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtLong = s => { const d = pdate(s); return `${DOW[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()} '${String(d.getFullYear()).slice(2)}`; };
const weekStartOf = (s, ws) => { const d = pdate(s); d.setDate(d.getDate() - ((d.getDay() - ws + 7) % 7)); return dstr(d); };
const fmtNum = n => (Math.round(n * 10) / 10).toLocaleString('en-US');
const fmtClock = sec => { const m = Math.floor(sec / 60) % 1440; const h = Math.floor(m / 60); return `${h % 12 || 12}:${pad(m % 60)} ${h >= 12 ? 'pm' : 'am'}`; };
const fmtMin = m => { if (m < 60) return `${m} min`; const h = Math.floor(m / 60), r = m % 60; return r ? `${h} hr ${r} min` : `${h} hr`; };
const fmtDurClock = (s0, s1) => fmtMin(Math.floor(s1 / 60) - Math.floor(s0 / 60));   // like Commit's printed totals
const fmtDur = sec => { const m = Math.round(sec / 60); if (m < 60) return `${m} min`; const h = Math.floor(m / 60), r = m % 60; return r ? `${h} hr ${r} min` : `${h} hr`; };
const fmtMS = sec => `${Math.floor(sec / 60)}:${pad(Math.round(sec % 60) % 60)}`;
const timeToSec = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? (+m[1] * 3600 + +m[2] * 60) : 15.5 * 3600; };
const parseIntervalStr = s => {
  s = String(s).trim(); let m;
  if ((m = /^(\d+):(\d{1,2})$/.exec(s))) return +m[1] * 60 + +m[2];
  if ((m = /^:(\d{1,2})$/.exec(s))) return +m[1];
  if (/^\d+$/.test(s)) return +s;
  return null;
};
const round25 = v => Math.round(v / 25) * 25;

/* ---------- tagging (stroke / type / intensity / equipment) ---------- */
const DIM = {
  stroke: [
    ['Free',  'free|freestyle|fr|crawl'],
    ['Back',  'back|backstroke|bk'],
    ['Breast','breast|breaststroke|br'],
    ['Fly',   'fly|butterfly|fl'],
    ['IM',    'im|jmi|medley'],
    ['Choice','choice|any stroke|your stroke']
  ],
  type: [
    ['Swim','swim|swims|swimming'],
    ['Kick','kick|kicks|kicking|kb'],
    ['Drill','drill|drills'],
    ['Pull','pull|paddles?|buoy']
  ],
  intensity: [
    ['Pace','pace|threshold|goal'],
    ['Sprint','sprint|sprints|all[- ]?out|max'],
    ['Fast','fast|race|racing|explosive|burst'],
    ['Build','build|builds|descend|negative split'],
    ['Moderate','mod|moderate|steady|aerobic|strong'],
    ['Easy','ez|easy|recovery|relax|loosen|cool[- ]?down|warm[- ]?up']
  ],
  equip: [
    ['Paddles','paddles?'], ['Buoys','buoys?|pull'], ['Fins','fins?'], ['Snorkels','snorkels?'],
    ['Boards','kickboards?|boards?'], ['Zoomers','zoomers?'], ['Bands','bands?'], ['Buckets','buckets?'], ['Tubes','tubes?']
  ]
};
const ORDER = {
  stroke: ['Free','Back','Breast','Fly','IM','Choice'],
  type: ['Swim','Kick','Drill','Pull'],
  intensity: ['Easy','Moderate','Build','Pace','Fast','Sprint'],
  equip: ['Paddles','Buoys','Fins','Snorkels','Boards','Zoomers','Bands','Buckets','Tubes']
};
const COLORS = {
  stroke: {Free:'#2F6FB5',Back:'#7A5BC4',Breast:'#2E8B57',Fly:'#C9488A',IM:'#D99A00',Choice:'#7D8F9B'},
  type: {Swim:'#0E8794',Kick:'#E4752B',Drill:'#7A5BC4',Pull:'#2E8B57'},
  intensity: {Easy:'#9ACFD9',Moderate:'#4FA3B5',Build:'#D99A00',Pace:'#E4752B',Fast:'#C23B2B',Sprint:'#8E1B12'},
  equip: Object.fromEntries(['Paddles','Buoys','Fins','Snorkels','Boards','Zoomers','Bands','Buckets','Tubes'].map(k => [k, '#A0643C']))
};
const DIMS = ['stroke', 'type', 'intensity', 'equip'];

function expandAbbr(s) {
  const M = { k: 'kick', d: 'drill', s: 'swim', p: 'pull' };
  return s.replace(/(^|[\s/(,])([ksdp])(?=[\s/),.:;]|$)/gi, (m, pre, c) => pre + M[c.toLowerCase()]);
}
function distribute(desc, defs, mode) {

function hl(raw) {
  const re = /(\[[^\]]*\]|\([^)]*\))|(^\s*\d+\s*[xX]\s*\d+(?:\.\d+)?)|((?:@|\bon\b|\bat\b|[xX])\s*(?:\d{1,2}:\d{2}|:\d{2}))|(^\s*\d{1,3}:\d{2}\b)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(raw))) {
    out += esc(raw.slice(last, m.index));
    const cls = m[1] ? 't-note' : m[2] ? 't-set' : m[3] ? 't-int' : 't-time';
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
    if (m[0].length === 0) re.lastIndex++;
  }
  return out + esc(raw.slice(last));
}

function insertText(ta, text) {
  ta.focus();
  let ok = false;
  try { ok = document.execCommand && document.execCommand('insertText', false, text); } catch (e) { ok = false; }
  if (!ok) { ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input', { bubbles: true })); }
}
function onKey(e) {
  const ta = e.target;
  if (e.key === 'Tab') {
    e.preventDefault();
    const v = ta.value, s = ta.selectionStart, en = ta.selectionEnd, out = e.shiftKey;
    if (s === en && !out) { insertText(ta, '  '); return; }
    const ls = v.lastIndexOf('\n', s - 1) + 1; let le = v.indexOf('\n', en); if (le < 0) le = v.length;
    const nb = v.slice(ls, le).split('\n').map(l => out ? l.replace(/^ {1,2}/, '') : '  ' + l).join('\n');
    ta.setSelectionRange(ls, le); insertText(ta, nb); ta.setSelectionRange(ls, ls + nb.length);
  } else if (e.key === 'Enter' && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const s = ta.selectionStart, ls = ta.value.lastIndexOf('\n', s - 1) + 1, line = ta.value.slice(ls, s);
    if (ta.selectionStart !== ta.selectionEnd) return;
    e.preventDefault();
    if (line.length && !line.trim()) { ta.setSelectionRange(ls, s); insertText(ta, '\n'); return; }
    const ind = line.match(/^ */)[0];
    const opens = (/^\s*#\s*\S/.test(line) && !/^\s*#\s*(all|everyone|everybody|shared|team)\s*$/i.test(line))
      || /^\s*(\d+\s*[xX]|\d+\s*(rounds?|times))\s*(?:[\[(].*)?$/i.test(line) || /^\s*(warm[- ]?up|cool[- ]?down|main( set)?|pre-?set|post-?set)\s*:?\s*$/i.test(line);
    insertText(ta, '\n' + ind + (opens ? '  ' : ''));
  }
}

    const input = d.querySelector('#g-name');
    const put = txt => { closeDlg(); const before = ta.value.slice(0, ta.selectionStart); insertText(ta, (before && !before.endsWith('\n') ? '\n' : '') + txt + '\n' + (txt === '#All' ? '' : '  ')); };
    d.querySelector('#g-add').onclick = () => { const n = input.value.trim(); if (n) put('#' + n.replace(/^#+/, '')); else input.focus(); };
    input.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); d.querySelector('#g-add').click(); } };
    d.querySelector('#g-all').onclick = () => put('#All');
    d.querySelectorAll('.chips button').forEach(b => b.onclick = () => put('#' + b.dataset.n));
    setTimeout(() => input.focus(), 30);
  });
}
function copyDialog(w) {
  dialog(`<h2>Copy practice</h2>
    <label class="f">Copy to date<input type="date" id="cp-date" value="${addDays(w.date, 7)}"></label>
    <div class="foot"><button class="btn" id="cp-no">Cancel</button><button class="btn primary" id="cp-yes">Copy</button></div>`, d => {
    d.querySelector('#cp-no').onclick = closeDlg;
    d.querySelector('#cp-yes').onclick = () => {
      const date = d.querySelector('#cp-date').value; if (!date) return;
      const c = Object.assign({}, w, { id: uid(), date, created: Date.now() }); delete c._update;
      db.workouts[c.id] = c; saveDB(); closeDlg(); toast(`Copied to ${fmtShort(date)}`);
    };
  });
}

/* ---------- print ---------- */
function printWorkout(w) {
  const A = analyze(w), ua = unitAbbr(w.unit);
  const pages = A.items.map(it => {
    const per = it.res.per; let body = '';
    A.parsed.forEach((L, i) => {
      const p = per[i]; if (!p || !p.applies || L.kind === 'group') return;
      if (L.kind === 'blank') { body += '<div class="gap"></div>'; return; }
      body += `<div class="l" style="padding-left:${Math.max(0, L.indent - (L.base != null ? L.base : 0)) * 0.5}em">${esc(L.text)}</div>`;
      if (p.showTotal) body += `<div class="rt">${fmtNum(p.cumY)} ${ua} ${fmtClock(A.W.startSec + p.cumS)}</div>`;
    });
    const tag = it.name ? `#${esc(it.name)}` : '';
    return `<div class="pp"><div class="h"><b>${esc(w.title || 'Practice')}</b><span>${fmtLong(w.date)} - ${fmtClock(A.W.startSec)} ${w.pool || 25} ${unitWord(w.unit)}</span><small>Default interval: ${fmtMS(w.defSec || 90)} per 100</small></div>
      ${tag ? `<div class="tag">${tag}</div>` : ''}${body}
      <div class="tot">${tag ? tag + ' totals: ' : ''}${fmtNum(it.res.yds)} ${unitWord(w.unit)} - ${fmtClock(it.res.end)} (${fmtDurClock(A.W.startSec, it.res.end)})</div></div>`;
  });
  document.getElementById('printRoot').innerHTML = pages.join('');
  window.print();
}

/* ---------- search ---------- */
function renderSearch() {
  app.onclick = null;
  app.innerHTML = `<div class="wk-head"><h1>Search</h1><input type="search" id="q" placeholder="Search titles and sets, e.g. “Pace” or “IM”" style="flex:1;min-width:240px;font-size:18px;padding:9px 12px" value="${esc(state.q)}" aria-label="Search practices"></div>
    <div class="card" id="res"></div>`;
  const input = document.getElementById('q'), res = document.getElementById('res');
  function run() {
    const q = state.q.trim().toLowerCase();
    let list = allWorkouts().sort((a, b) => b.date.localeCompare(a.date) || (b.time || '').localeCompare(a.time || ''));
    if (q) list = list.filter(w => (w.title + '\n' + w.text).toLowerCase().includes(q));
    if (!list.length) { res.innerHTML = `<div class="empty">${q ? 'No practices match that search.' : 'No practices yet. Add one from the Week page.'}</div>`; return; }
    res.innerHTML = list.slice(0, 100).map(w => {
      const A = analyze(w), r = pick(A, 'max');
      let snip = '';
      if (q) { const line = (w.text || '').split('\n').find(l => l.toLowerCase().includes(q)); if (line) snip = esc(line.trim()).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig'), m => `<mark>${m}</mark>`); }
      else snip = esc((w.text || '').split('\n').filter(l => l.trim()).slice(0, 3).join('  ·  '));
      return `<div class="sr-row"><div><b>${fmtShort(w.date)}</b><div class="muted" style="font-size:13px">${fmtNum(r.yds)} ${unitAbbr(w.unit)}</div></div>
        <div style="min-width:0"><div style="font-weight:500">${esc(w.title || 'Untitled practice')}</div><div class="snip">${snip}</div></div>
        <div style="display:flex;gap:6px"><button class="btn sm" data-open="${w.id}">Open</button><button class="btn sm" data-copy="${w.id}">Copy to…</button></div></div>`;
    }).join('') + (list.length > 100 ? `<div class="empty">Showing the 100 most recent matches.</div>` : '');
  }
  input.oninput = () => { state.q = input.value; run(); };
  res.onclick = e => {
    const o = e.target.closest('[data-open]'), c = e.target.closest('[data-copy]');
    if (o) go('#/edit/' + o.dataset.open); else if (c) copyDialog(db.workouts[c.dataset.copy]);
  };
  run(); input.focus();
}

/* ---------- settings & backup ---------- */
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function csvText() {
  const rows = [['Date', 'Practice', 'Group', 'Distance', 'Unit', 'Minutes']];
  allWorkouts().sort((a, b) => a.date.localeCompare(b.date)).forEach(w => analyze(w).items.forEach(it =>
    rows.push([w.date, w.title, it.name || 'Everyone', Math.round(it.res.yds * 10) / 10, unitWord(w.unit), Math.round(it.res.secs / 60)])));
  return rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
}
function settingsDialog() {
  const s = db.settings;
  dialog(`<h2>Settings &amp; backup</h2>
    <div class="row">
      <label class="f">Week starts on<select id="s-ws"><option value="1"${s.weekStart === 1 ? ' selected' : ''}>Monday</option><option value="0"${s.weekStart === 0 ? ' selected' : ''}>Sunday</option></select></label>
      <label class="f">New practice start<input type="time" id="s-time" value="${esc(s.startTime)}"></label>
      <label class="f">Default interval /100<input type="text" id="s-ivl" class="ivl" value="${fmtMS(s.defSec)}" style="width:84px"></label>
    </div>
    <div class="row">
      <label class="f">Pool length<input type="number" id="s-pool" min="1" value="${s.pool}" style="width:80px"></label>
      <label class="f">Units<select id="s-unit"><option value="yards"${s.unit === 'yards' ? ' selected' : ''}>yards</option><option value="meters"${s.unit === 'meters' ? ' selected' : ''}>meters</option></select></label>
    </div>
    <p class="muted" style="margin:0;font-size:14px">These apply to new practices. Existing practices keep their own values.</p>
    <hr>
    <p style="margin:0">Your practices live in this browser only. Download a backup now and then, and use it to move to another computer or phone.</p>
    <div class="row"><button class="btn" id="s-dl">Download backup</button><button class="btn" id="s-up">Restore from backup…</button><button class="btn" id="s-csv">Export totals (CSV)</button></div>
    <input type="file" id="s-file" accept="application/json,.json" class="sr">
    <hr>
    <div class="foot"><button class="btn danger" id="s-wipe" style="margin-right:auto">Delete all practices</button><button class="btn primary" id="s-done">Done</button></div>`, d => {
    const q = id => d.querySelector(id);
    q('#s-done').onclick = () => {
      const iv = parseIntervalStr(q('#s-ivl').value);
      Object.assign(db.settings, { weekStart: +q('#s-ws').value, startTime: q('#s-time').value || '15:30', defSec: iv || s.defSec, pool: +q('#s-pool').value || 25, unit: q('#s-unit').value });
      saveDB(); closeDlg(); route();
    };
    q('#s-dl').onclick = () => download(`pool-deck-backup-${todayStr()}.json`, JSON.stringify(db, null, 1), 'application/json');
    q('#s-csv').onclick = () => download(`pool-deck-totals-${todayStr()}.csv`, csvText(), 'text/csv');
    q('#s-up').onclick = () => q('#s-file').click();
    q('#s-file').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d2 = JSON.parse(r.result);
          if (!d2 || typeof d2.workouts !== 'object') throw new Error('bad');
          if (!confirm(`Replace everything here with the backup (${Object.keys(d2.workouts).length} practices)?`)) return;
          db = { workouts: d2.workouts, groupColors: d2.groupColors || {}, settings: Object.assign(defSettings(), d2.settings) };
          saveDB(); closeDlg(); toast('Backup restored'); route();
        } catch (err) { toast('That file is not a Pool Deck backup.'); }
      };
      r.readAsText(f);
    };
    q('#s-wipe').onclick = () => { if (confirm('Delete every practice? This cannot be undone. Download a backup first if unsure.')) { db.workouts = {}; saveDB(); closeDlg(); route(); } };
  });
}

/* ---------- start ---------- */
db = loadDB();
if (!db.settings.seeded && Object.keys(db.workouts).length === 0) { const w = sampleWorkout(todayStr()); db.workouts[w.id] = w; }
db.settings.seeded = true;
saveDB();
if (!storageOK) setStatus('Browser storage is blocked – changes will not be kept. Use Settings › Download backup.', true);
document.getElementById('btn-settings').onclick = settingsDialog;
window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', () => { if (saveTimer) saveDB(); });
window.addEventListener('afterprint', () => { document.getElementById('printRoot').innerHTML = ''; });
route();
</script>
</body>
